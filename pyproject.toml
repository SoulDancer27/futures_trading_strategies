[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysstrat"
version = "0.1.0"
description = "A minimal, educational systematic-trading backtester: volatility targeting, forecast scaling, and composable trading rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["systematic-trading", "backtesting", "quant", "trading-strategies", "forecast", "risk-targeting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
include = ["sysstrat*"]
